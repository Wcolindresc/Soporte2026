services:
  mysql:
    image: mysql:8.0
    env_file: [.env]
    volumes: ["mysql_data:/var/lib/mysql"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    depends_on: [mysql]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    depends_on: [api]

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]

volumes:
  mysql_data:
